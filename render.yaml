services:
  - type: web
    name: agentic-ai
    healthCheckPath: /
    envVars:
      - key: OPEN_BROWSER
        value: "0"
      - key: GROQ_API_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: SESSION_SECRET
        generateValue: true
